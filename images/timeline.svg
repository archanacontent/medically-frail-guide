<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 624" width="520" height="624" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif"><rect width="520" height="624" rx="14" fill="#f2f7fd"/><line x1="36" y1="40" x2="36" y2="520" stroke="#cfe0f3" stroke-width="2"/><circle cx="36" cy="40" r="8" fill="#f2f7fd" stroke="#0078d4" stroke-width="2.5" /><circle cx="36" cy="40" r="3.5" fill="#0078d4"/><circle cx="36" cy="176" r="8" fill="#f2f7fd" stroke="#0078d4" stroke-width="2.5" /><circle cx="36" cy="176" r="3.5" fill="#0078d4"/><circle cx="36" cy="290" r="9" fill="#c8432f"/><circle cx="36" cy="426" r="8" fill="#f2f7fd" stroke="#0078d4" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="36" cy="520" r="8" fill="#f2f7fd" stroke="#0078d4" stroke-width="2.5" stroke-dasharray="3 3"/><text x="64" y="45" font-size="13" font-weight="600" fill="#0078d4" text-anchor="start" letter-spacing="0.6">JUNE 3, 2026</text><text x="64" y="70" font-size="18" font-weight="600" fill="#0f2236" text-anchor="start" >CMS publishes the interim final</text><text x="64" y="92" font-size="18" font-weight="600" fill="#0f2236" text-anchor="start" >rule</text><text x="64" y="116" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >Adds a test that a condition must significantly</text><text x="64" y="136" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >impair the member&#8217;s ability to comply.</text><text x="64" y="181" font-size="13" font-weight="600" fill="#0078d4" text-anchor="start" letter-spacing="0.6">SEPTEMBER 2026</text><text x="64" y="206" font-size="18" font-weight="600" fill="#0f2236" text-anchor="start" >CMS issues frailty guidance</text><text x="64" y="230" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >An optional three-tier framework for finding</text><text x="64" y="250" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >frail members in data.</text><text x="64" y="295" font-size="13" font-weight="600" fill="#c8432f" text-anchor="start" letter-spacing="0.6">OCTOBER 29, 2026</text><text x="64" y="320" font-size="18" font-weight="600" fill="#0f2236" text-anchor="start" >Federal court strikes down the</text><text x="64" y="342" font-size="18" font-weight="600" fill="#0f2236" text-anchor="start" >added test</text><text x="64" y="366" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >The 12-month data limit and the 2028 self-</text><text x="64" y="386" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >declaration limit stay in place.</text><text x="64" y="431" font-size="13" font-weight="600" fill="#0078d4" text-anchor="start" letter-spacing="0.6">JANUARY 1, 2027</text><text x="64" y="456" font-size="18" font-weight="600" fill="#0f2236" text-anchor="start" >Work requirements begin</text><text x="64" y="480" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >In most states.</text><text x="64" y="525" font-size="13" font-weight="600" fill="#0078d4" text-anchor="start" letter-spacing="0.6">JANUARY 1, 2028</text><text x="64" y="550" font-size="18" font-weight="600" fill="#0f2236" text-anchor="start" >Self-declaration narrows</text><text x="64" y="574" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >Once per enrollment period, then data or</text><text x="64" y="594" font-size="15" font-weight="400" fill="#4f6478" text-anchor="start" >documentation.</text></svg>