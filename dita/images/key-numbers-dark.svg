<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 292" width="520" height="292" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif"><rect width="520" height="292" rx="14" fill="#0f1c2b"/><rect x="16" y="16" width="236" height="124" rx="12" fill="#132436" stroke="#24405e"/><rect x="16" y="34" width="4" height="88" rx="2" fill="#4ca8ff"/><text x="36" y="62" font-size="27" font-weight="700" fill="#4ca8ff" text-anchor="start" >Jan 1, 2027</text><text x="36" y="90" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >Work requirements begin</text><text x="36" y="110" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >in most states</text><rect x="268" y="16" width="236" height="124" rx="12" fill="#132436" stroke="#24405e"/><rect x="268" y="34" width="4" height="88" rx="2" fill="#4ca8ff"/><text x="288" y="62" font-size="27" font-weight="700" fill="#4ca8ff" text-anchor="start" >12 months</text><text x="288" y="90" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >Of claims data states can</text><text x="288" y="110" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >use to verify frailty</text><rect x="16" y="152" width="236" height="124" rx="12" fill="#132436" stroke="#24405e"/><rect x="16" y="170" width="4" height="88" rx="2" fill="#4ca8ff"/><text x="36" y="198" font-size="27" font-weight="700" fill="#4ca8ff" text-anchor="start" >30 days</text><text x="36" y="226" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >For a member to answer a</text><text x="36" y="246" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >noncompliance notice</text><rect x="268" y="152" width="236" height="124" rx="12" fill="#132436" stroke="#24405e"/><rect x="268" y="170" width="4" height="88" rx="2" fill="#4ca8ff"/><text x="288" y="198" font-size="27" font-weight="700" fill="#4ca8ff" text-anchor="start" >Once</text><text x="288" y="226" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >Self-declaration allowed</text><text x="288" y="246" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >per enrollment period</text><text x="288" y="266" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="start" >from 2028</text></svg>