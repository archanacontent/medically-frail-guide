<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 502" width="520" height="502" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif"><rect width="520" height="502" rx="14" fill="#0f1c2b"/><rect x="16" y="20" width="488" height="70" rx="12" fill="#132436" stroke="#4ca8ff" stroke-width="2"/><text x="260.0" y="51" font-size="18" font-weight="600" fill="#e8f1fb" text-anchor="middle" >State condition list</text><text x="260.0" y="74" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="middle" >Five federal groups, mapped to codes</text><path d="M260.0 95 v18 m-6 -6 l6 6 l6 -6" fill="none" stroke="#6f88a0" stroke-width="2"/><rect x="32" y="118" width="456" height="70" rx="12" fill="#132436" stroke="#4ca8ff" stroke-width="2"/><text x="260.0" y="149" font-size="18" font-weight="600" fill="#e8f1fb" text-anchor="middle" >12 months of claims</text><text x="260.0" y="172" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="middle" >Paid, pended and denied, plus encounters</text><path d="M260.0 193 v18 m-6 -6 l6 6 l6 -6" fill="none" stroke="#6f88a0" stroke-width="2"/><rect x="48" y="216" width="424" height="70" rx="12" fill="#132436" stroke="#5fd39a" stroke-width="2"/><text x="260.0" y="247" font-size="18" font-weight="600" fill="#e8f1fb" text-anchor="middle" >Tier 1 match</text><text x="260.0" y="270" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="middle" >Exempt with no request</text><path d="M260.0 291 v18 m-6 -6 l6 6 l6 -6" fill="none" stroke="#6f88a0" stroke-width="2"/><rect x="64" y="314" width="392" height="70" rx="12" fill="#132436" stroke="#f2b45a" stroke-width="2"/><text x="260.0" y="345" font-size="18" font-weight="600" fill="#e8f1fb" text-anchor="middle" >Tier 2 or 3</text><text x="260.0" y="368" font-size="15" font-weight="400" fill="#a7bbcf" text-anchor="middle" >More data, then caseworker review</text><path d="M260.0 389 v18 m-6 -6 l6 6 l6 -6" fill="none" stroke="#6f88a0" stroke-width="2"/><rect x="80" y="412" width="360"